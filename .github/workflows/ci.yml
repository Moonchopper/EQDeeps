name: CI

on:
  push:
    branches: [main]
  pull_request:

# A PR that gets pushed twice in a minute doesn't need the first run to finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately no actions/setup-dotnet: the windows runner image already
      # ships SDK 8.0.423, and global.json pins us to it. The action ignores
      # preinstalled SDKs and re-downloads its own, which cost 40s of a 113s run.
      - name: Show SDK
        run: dotnet --version

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          # The action caches npm's download cache by itself from v5 on, when
          # package.json names a package manager. Left alone that would quietly
          # reinstate the strategy the step below exists to replace — and pay
          # for both.
          package-manager-cache: false

      # Caching node_modules outright beats caching npm's download cache:
      # the tarball cache still left `npm ci` reinstalling 98 packages for 8s.
      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v6
        with:
          path: ui/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}

      - name: Install SPA deps
        if: steps.node-cache.outputs.cache-hit != 'true'
        run: npm --prefix ui ci

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # One restore for the whole solution, so the --no-restore/--no-build flags
      # below skip work that provably already ran here — same job, same tree,
      # same RID. That "same RID" caveat is why publish in release.yml still
      # restores for itself: a RID-less restore does not satisfy -r win-x64.
      #
      # Lock files (+ --locked-mode) would be the textbook hardening here, but
      # RestorePackagesWithLockFile is incompatible with this repo's global
      # TargetFramework in Directory.Build.props — it fails solution restore with
      # "Invalid framework identifier ''". It buys no time either; don't retry it.
      - name: Restore
        run: dotnet restore

      # The SPA builds into src/EQDeeps.Server/wwwroot, which the server embeds.
      - name: Build SPA
        run: npm --prefix ui run build

      # Geometry regression checks against the real stylesheet. Uses the
      # runner's preinstalled Edge via playwright's `channel: msedge`, so the
      # env var below keeps `npm ci` from fetching ~100MB of browsers it will
      # never launch. Roughly two seconds; see ui/scripts/layout-check.mjs for
      # the three shipped bugs that motivated it.
      - name: Layout checks
        run: npm --prefix ui run test:layout

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build
