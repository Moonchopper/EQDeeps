name: DCO

# Contributions come in under the project licence and stay with their authors
# (CONTRIBUTING.md); the Developer Certificate of Origin is how that is
# certified, and a requirement nothing checks is a requirement in name only.
#
# Deliberately not one of the DCO marketplace actions: this is twenty lines of
# git, and a workflow gating every pull request is the last place to take on a
# third-party dependency for the sake of twenty lines.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dco-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the check walks base..head, and both ends have to exist.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Every commit carries a matching sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          # --no-merges: a merge commit is not a contribution, and asking for a
          # sign-off on one only teaches people to sign off on work they did not
          # write.
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show -s --format='%ae' "$sha")
            name=$(git show -s --format='%an' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            # The DCO is a claim by a person about a patch, so the sign-off has
            # to be that person — a trailer naming somebody else certifies
            # nothing about the commit it sits on. The emails are compared as
            # fixed strings rather than interpolated into a pattern: GitHub's
            # own noreply addresses contain a '+', which read as a regex would
            # match a different address than the one on the commit.
            signoffs=$(git show -s --format='%B' "$sha" |
              sed -n 's/^[Ss]igned-off-by:.*<\(.*\)>[[:space:]]*$/\1/p')
            if printf '%s\n' "$signoffs" | grep -qxF "$author"; then
              echo "ok   ${sha:0:8}  $subject"
            else
              echo "MISS ${sha:0:8}  $subject"
              echo "     wanted: Signed-off-by: $name <$author>"
              failed=1
            fi
          done
          if [ "$failed" = 1 ]; then
            echo
            echo "Commits above are missing a Developer Certificate of Origin"
            echo "sign-off; see CONTRIBUTING.md. To fix a whole branch at once:"
            echo
            echo "    git rebase --signoff ${BASE:0:8}"
            echo "    git push --force-with-lease"
            exit 1
          fi
