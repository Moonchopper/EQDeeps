name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # OIDC token for Artifact Signing — no stored Azure secret

jobs:
  release:
    runs-on: windows-latest
    # Required, not cosmetic: the federated credential only honours tokens whose
    # subject is repo:Moonchopper/EQDeeps:environment:release. Drop this and
    # Azure login fails with AADSTS700213.
    environment: release
    steps:
      - uses: actions/checkout@v7
      # No actions/setup-dotnet: global.json pins the 8.0 band and the runner
      # image already ships it, so the action's 285 MB re-download is dead time.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Version from tag
        id: version
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Build SPA
        run: |
          npm --prefix ui ci
          npm --prefix ui run build

      - name: Test
        run: dotnet test -c Release

      # A folder, not a single-file exe: Inno Setup installs an application
      # directory and the updater replaces it in place (ADR-010).
      - name: Publish win-x64
        shell: pwsh
        run: >
          dotnet publish src/EQDeeps.Server -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/win-x64

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Sign the app before it goes into the installer, so the exe users launch
      # every day is signed too — not just the one-time setup program.
      # Certificates are only valid three days, so the RFC3161 timestamp is what
      # keeps signatures verifying long after; don't drop it.
      - name: Sign application
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\win-x64
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DPayloadDir=..\artifacts\win-x64" `
            "installer\EQDeeps.iss"

      # The installer is what the updater downloads and executes on a user's
      # machine, so this signature is the one that actually gates auto-update:
      # UpdateService refuses to run anything WinVerifyTrust rejects.
      - name: Sign installer
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # The signing action can succeed while leaving a file unsigned if the
      # folder filter matches nothing. Fail the release rather than ship an
      # installer that every client would then refuse to apply.
      - name: Verify signatures
        shell: pwsh
        run: |
          $targets = @(
            "artifacts/win-x64/EQDeeps.Server.exe",
            "artifacts/installer/EQDeeps-Setup-${{ steps.version.outputs.version }}.exe"
          )
          foreach ($target in $targets) {
            $sig = Get-AuthenticodeSignature $target
            if ($sig.Status -ne 'Valid') {
              throw "$target is not validly signed (status: $($sig.Status))."
            }
            if (-not $sig.TimeStamperCertificate) {
              throw "$target is not timestamped — it would stop verifying in three days."
            }
            Write-Host "$target signed by: $($sig.SignerCertificate.Subject)"
          }

      # Portable zip for people who don't want an installer. It self-reports as
      # not installable, so it links to the release instead of updating itself.
      - name: Zip portable build
        shell: pwsh
        run: |
          Copy-Item NOTICE artifacts/win-x64/NOTICE.txt -Force
          Compress-Archive -Path artifacts/win-x64/* `
            -DestinationPath "EQDeeps-${{ steps.version.outputs.version }}-win-x64.zip"

      # Everything the release will contain has to exist BEFORE it is created:
      # this repo has immutable releases enabled, so a published release's
      # assets are frozen and the app cast could never be attached afterwards.
      # The notes are written into the app cast as the changelog the in-app
      # consent dialog shows, so they are decided here rather than by the
      # release action. They come from CHANGELOG.md — the section for this
      # version, written for players — and only fall back to the generated
      # PR list, with a warning, when that section is missing: a release
      # cannot be retried under the same tag, so missing notes must not sink
      # it, but they must not pass unnoticed either.
      - name: Build app cast
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if (-not $env:SPARKLE_PRIVATE_KEY) {
            throw "SPARKLE_PRIVATE_KEY is not set — clients could not verify this release."
          }

          # Secrets pick up stray bytes surprisingly easily — a BOM or trailing
          # newline from however the value was piped in when it was set. Base64
          # tolerates whitespace but not a BOM, which is exactly how v0.4.1 failed.
          $env:SPARKLE_PRIVATE_KEY = $env:SPARKLE_PRIVATE_KEY.Trim() -replace "^﻿", ""

          # The generator refuses to sign unless BOTH halves of the key are
          # available, and the public half must be exactly the one compiled into
          # the app — if those ever drift, every client rejects every release.
          # So read it from the source of truth instead of duplicating it here.
          $source = Get-Content src/EQDeeps.Server/Updates/UpdateService.cs -Raw
          $key = [regex]::Match($source, 'const string PublicKey = "([^"]+)"')
          if (-not $key.Success) {
            throw "could not read PublicKey from UpdateService.cs — app cast would be unsigned."
          }
          $env:SPARKLE_PUBLIC_KEY = $key.Groups[1].Value

          # Fail with a readable message rather than the generator's opaque
          # "not a valid Base-64 string" buried in its own error handling.
          foreach ($pair in @(@("private", $env:SPARKLE_PRIVATE_KEY), @("public", $env:SPARKLE_PUBLIC_KEY))) {
            try { $bytes = [Convert]::FromBase64String($pair[1]) }
            catch { throw "$($pair[0]) Ed25519 key is not valid base64 — see docs/release-signing.md." }
            if ($bytes.Length -ne 32) {
              throw "$($pair[0]) Ed25519 key decodes to $($bytes.Length) bytes, expected 32."
            }
          }

          dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.9.0

          # The player-facing notes: the "## vX.Y.Z" section of CHANGELOG.md,
          # up to the next "## " heading. Failing that, generate-notes gives
          # the "What's Changed" PR list the release UI would — technical,
          # and said so in the log — rather than no release at all.
          New-Item -ItemType Directory -Force artifacts/notes | Out-Null
          $version = "${{ steps.version.outputs.version }}"
          $notes = $null
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md -Encoding utf8
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^##\s+v?$([regex]::Escape($version))\b") { $start = $i + 1; break }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match "^##\s") { $end = $i; break }
              }
              $notes = (($lines[$start..($end - 1)] -join "`n").Trim())
              if (-not $notes) { $notes = $null }
            }
          }
          if (-not $notes) {
            Write-Host "::warning::CHANGELOG.md has no section for v$version - falling back to the generated PR list. Players will see commit titles."
            $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" `
              -f tag_name=${{ github.ref_name }} --jq .body
            if (-not $notes) { throw "could not generate release notes for ${{ github.ref_name }}." }
          }
          Set-Content -Path "artifacts/notes/$version.md" -Value $notes -Encoding utf8
          Set-Content -Path artifacts/release-notes.md -Value $notes -Encoding utf8

          netsparkle-generate-appcast `
            --binaries artifacts/installer `
            --ext exe `
            --file-version ${{ steps.version.outputs.version }} `
            --product-name EQDeeps `
            --os windows `
            --base-url "https://github.com/Moonchopper/EQDeeps/releases/download/${{ github.ref_name }}" `
            --change-log-path artifacts/notes `
            --appcast-output-directory artifacts/appcast `
            --human-readable
          if ($LASTEXITCODE -ne 0) { throw "app cast generation failed" }

          # Strict mode needs both signatures: one over the installer (carried
          # inside the app cast) and one over the app cast itself.
          if (-not (Test-Path artifacts/appcast/appcast.xml.signature)) {
            throw "app cast signature missing — clients in Strict mode would reject it."
          }

      # Publishes once, with everything attached. The app cast rides along here
      # rather than being uploaded afterwards, which immutable releases forbid.
      # Attaching it to each release is what makes
      # releases/latest/download/appcast.xml resolve for every client.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/installer/EQDeeps-Setup-${{ steps.version.outputs.version }}.exe
            EQDeeps-*.zip
            artifacts/appcast/appcast.xml
            artifacts/appcast/appcast.xml.signature
